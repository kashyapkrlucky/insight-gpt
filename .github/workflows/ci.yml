name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # These are the only vars that fail the build if unset — clients for
          # everything else (Qdrant, Prisma, JWT) are constructed lazily at
          # request time, not at module load, so the build doesn't need them.
          #
          # Values below are inert build-time placeholders, not real
          # credentials — no external service is called during `next build`.
          # They only need to look well-formed enough for the SDK
          # constructors (OpenAI, Supabase) to accept them.
          AI_API_KEY: "sk-placeholder-build-only"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
